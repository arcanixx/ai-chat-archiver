<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Chat Archiver</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 250px; margin: 0; padding: 16px; background: #fff; color: #111; }
    h1 { font-size: 16px; margin: 0 0 16px 0; }
    button { width: 100%; padding: 8px; margin-bottom: 8px; cursor: pointer; background: #4f46e5; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #4338ca; }
    .secondary { background: #e5e7eb; color: #374151; }
    .secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <h1 id="title" data-i18n="extName">AI Chat Archiver</h1>
  <button id="btn-save" data-i18n="saveButton">Save this chat</button>
  <button id="btn-selection" data-i18n="saveSelection" class="secondary">Save selection</button>
  <button id="btn-bulk" data-i18n="bulkExportTitle" class="secondary">Bulk Export</button>
  <button id="btn-options" data-i18n="optionsTitle" class="secondary">Options</button>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
