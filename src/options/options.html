<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Chat Archiver - Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
    h1 { font-size: 24px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 20px 0 8px; color: #374151; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 500; margin-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
    .checkbox-label { display: flex; align-items: center; font-weight: normal; margin-bottom: 4px; }
    .checkbox-label input { margin-right: 8px; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 2px; }
    button { padding: 8px 16px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #4338ca; }
    #status { margin-top: 16px; color: #059669; font-weight: 500; }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle">AI Chat Archiver Settings</h1>

  <h2>Storage</h2>
  <div class="form-group">
    <label>Folder (relative to Downloads):</label>
    <input type="text" id="folder" placeholder="AI-Chats">
  </div>

  <div class="form-group">
    <label>Filename Template:</label>
    <input type="text" id="filenameTemplate" placeholder="{title}__{provider}__{datetime}">
  </div>

  <h2>General</h2>
  <div class="form-group">
    <label class="checkbox-label">
      <input type="checkbox" id="showFloatingButton"> Show floating save button on chat pages
    </label>
  </div>

  <div class="form-group">
    <label class="checkbox-label">
      <input type="checkbox" id="autoSave"> Auto-save after each AI response
    </label>
  </div>

  <div class="form-group">
    <label>Title prefix to ignore (for deduplication):</label>
    <input type="text" id="titlePrefixIgnore" placeholder="e.g. [OLD]">
    <div class="hint">If set, "[OLD] Prism" and "Prism" are treated as the same chat when deduplicating.</div>
  </div>

  <h2>Export formats</h2>
  <div class="form-group">
    <label class="checkbox-label"><input type="checkbox" id="fmt-md"> Markdown (.md)</label>
    <label class="checkbox-label"><input type="checkbox" id="fmt-json"> JSON (.json)</label>
    <label class="checkbox-label"><input type="checkbox" id="fmt-html"> HTML (.html)</label>
  </div>

  <h2>AI Providers</h2>
  <div class="form-group">
    <label class="checkbox-label"><input type="checkbox" id="prov-claude"> Claude</label>
    <label class="checkbox-label"><input type="checkbox" id="prov-chatgpt"> ChatGPT</label>
    <label class="checkbox-label"><input type="checkbox" id="prov-gemini"> Gemini</label>
    <label class="checkbox-label"><input type="checkbox" id="prov-deepseek"> DeepSeek</label>
    <label class="checkbox-label"><input type="checkbox" id="prov-kimi"> Kimi</label>
    <label class="checkbox-label"><input type="checkbox" id="prov-grok"> Grok</label>
    <label class="checkbox-label"><input type="checkbox" id="prov-copilot"> Copilot</label>
  </div>

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <script type="module" src="./options.ts"></script>
</body>
</html>
